<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APEX TRADE</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff}.wrap{max-width:430px;margin:0 auto;min-height:100vh;background:#000;display:flex;flex-direction:column}.inp{width:100%;background:#191919;border:1px solid #2a2a2a;padding:14px;border-radius:12px;color:#fff;margin-top:10px}.btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:900}.btn-w{background:#fff;color:#000}.btn-g{background:#22c55e;color:#000}.btn-d{background:#222;color:#fff}.phase{flex:1;overflow:auto;padding-bottom:70px}.hidden{display:none!important}.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #222;background:#000;padding:10px 0;position:fixed;bottom:0;width:100%;max-width:430px}.nav button{background:0;border:0;color:#fff;opacity:.5;font-size:12px}.nav button.on{opacity:1;color:#22c55e;font-weight:900}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 12px;border-bottom:1px solid #111}.sb{width:92px;background:#151515;border-radius:10px;padding:8px 6px;text-align:center;border:1px solid #222}.more{background:#1e1e1e;border-radius:14px;padding:16px;margin:8px 12px;display:flex;justify-content:space-between;align-items:center;border:1px solid #252525}.more.blue{background:#0095ff;border-color:#0095ff}.modal{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:14px;z-index:999}.box{background:#161616;border:1px solid #333;border-radius:18px;padding:16px;width:100%;max-width:380px;max-height:80vh;overflow:auto}
</style></head><body><div class="wrap">
<div id="auth" style="position:fixed;inset:0;background:#000;z-index:100;padding:20px;overflow:auto"><div style="text-align:center;margin:24px 0"><div style="width:70px;height:70px;background:#111;border-radius:20px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:30px">A↗</div><b style="letter-spacing:3px;display:block;margin-top:8px">APEX TRADE</b></div><div id="siBox"><h3>Sign In</h3><input id="siE" class="inp" placeholder="Email"><input id="siP" class="inp" type="password" placeholder="Password"><div id="siErr" class="hidden" style="color:#f44;font-size:11px;text-align:center;margin-top:8px"></div><button onclick="doSI()" class="btn btn-w" style="margin-top:12px">SIGN IN →</button><p style="text-align:center;font-size:12px;margin-top:10px;opacity:.6">No account? <button onclick="showA('su')" style="background:0;border:0;color:#3b82f6;font-weight:900">Sign Up</button></p></div><div id="suBox" class="hidden"><h3>Create Account</h3><input id="suN" class="inp" placeholder="Full Name"><input id="suE" class="inp" placeholder="Email"><input id="suPh" class="inp" placeholder="M-Pesa 07..."><input id="suP" class="inp" type="password" placeholder="Password"><input id="suCP" class="inp" type="password" placeholder="Confirm"><div id="suErr" class="hidden" style="color:#f44;font-size:11px;text-align:center;margin-top:8px"></div><button onclick="doSU()" class="btn btn-g" style="margin-top:12px">SIGN UP →</button><p style="text-align:center;font-size:12px;margin-top:10px;opacity:.6">Have account? <button onclick="showA('si')" style="background:0;border:0;color:#3b82f6;font-weight:900">Sign In</button></p></div></div>
<div style="padding:10px 12px;display:flex;justify-content:space-between;border-bottom:1px solid #111"><div><span id="accL" style="font-size:10px;background:#111;padding:4px 8px;border-radius:6px">DEMO</span><br><b id="balT">KSh 1,000.00</b></div><button onclick="showP('funds')" class="btn btn-w" style="width:auto;padding:8px 14px;font-size:11px">Deposit</button></div>

<div id="p-more" class="phase">
<div style="text-align:center;padding:20px 12px 10px"><span style="font-size:10px;background:#0095ff;padding:4px 10px;border-radius:20px">Verified</span><div style="margin-top:10px"><b id="mName" style="font-size:16px">amos</b><br><span id="mEmail" style="font-size:12px;opacity:.6">toxcykim@gmail.com</span><br><span id="mPh" style="font-size:13px;color:#22c55e;font-weight:700">0713667827</span></div></div>

<div class="nav"><button id="n-market" class="on" onclick="showP('market')">📈<br>Trade</button><button id="n-trade" onclick="showP('trade')">📊<br>Positions</button><button id="n-funds" onclick="showP('funds')">💰<br>Funds</button><button id="n-more" onclick="showP('more')">⋯<br>More</button></div></div>
<div id="modal" class="hidden modal"><div id="mBox" class="box"></div></div>
<script>
var mk=[{n:'XAUUSD',p:4424.62,up:0},{n:'BTCUSD',p:79842,up:0},{n:'EURUSD',p:1.1612,up:1},{n:'USDJPY',p:156.24,up:0},{n:'GBPUSD',p:1.3516,up:0},{n:'US100',p:29565,up:1},{n:'AUDUSD',p:0.7205,up:1},{n:'GBPJPY',p:211.17,up:0},{n:'AUDJPY',p:112.57,up:0},{n:'AUDCAD',p:0.9972,up:1}];
var bal={demo:1000,real:0},cA='demo',cP=4424.6,cS='XAUUSD',cand=[];
function showA(t){siBox.classList.toggle('hidden',t!='si');suBox.classList.toggle('hidden',t!='su');}
function doSU(){var n=suN.value.trim(),e=suE.value.trim().toLowerCase(),ph=suPh.value.trim(),pw=suP.value,cp=suCP.value,er=suErr;if(n.length<3||e.indexOf('@')<0||ph.length<10||pw.length<6||pw!==cp){er.innerText='Check fields';er.classList.remove('hidden');return;}var u=JSON.parse(localStorage.getItem('apex_users')||'[]');if(u.find(x=>x.email===e)){er.innerText='Exists';er.classList.remove('hidden');return;}u.push({name:n,email:e,phone:ph,pass:pw});localStorage.setItem('apex_users',JSON.stringify(u));localStorage.setItem('apex_current',e);localStorage.setItem('apex_name',n);localStorage.setItem('apex_phone',ph);ok(n,e,ph);}
function doSI(){var e=siE.value.trim().toLowerCase(),pw=siP.value,er=siErr;var u=JSON.parse(localStorage.getItem('apex_users')||'[]');var f=u.find(x=>x.email===e&&x.pass===pw);if(!f){er.innerText='Wrong';er.classList.remove('hidden');return;}localStorage.setItem('apex_current',f.email);localStorage.setItem('apex_name',f.name);localStorage.setItem('apex_phone',f.phone);ok(f.name,f.email,f.phone);}
function ok(n,e,p){auth.style.display='none';mName.innerText=n;mEmail.innerText=e;mPh.innerText=p;render();run();upd();initC();}
function logout(){localStorage.removeItem('apex_current');location.reload();}
function showP(p){document.querySelectorAll('.phase').forEach(x=>x.classList.add('hidden'));document.getElementById('p-'+p).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('on'));document.getElementById('n-'+p).classList.add('on');}
function render(){var h='';for(var i=0;i<mk.length;i++){var m=mk[i];var sp=m.n.includes('JPY')?0.032:m.n.includes('XAU')?0.45:m.p>1000?4.3:0.00021;var sell=(m.p - sp/2).toFixed(m.n.includes('JPY')?3:m.p>100?2:5);var buy=(m.p + sp/2).toFixed(m.n.includes('JPY')?3:m.p>100?2:5);var pct=(Math.random()*2.5+0.1).toFixed(2);var col=m.up?'#22c55e':'#ef4444',arr=m.up?'▲':'▼';h+='<div class="row"><div><div style="font-weight:700;font-size:13px">'+m.n+' <span style="opacity:.3">★</span></div><div style="color:'+col+';font-size:11px;margin-top:4px">'+arr+' '+pct+'%</div></div><div style="display:flex;gap:8px;align-items:center"><div onclick="openT(\''+m.n+'\',\'sell\')" class="sb"><small style="font-size:10px;opacity:.6">Sell</small><b style="color:'+col+';font-size:11px" id="s-'+i+'">'+sell+'</b></div><div onclick="openT(\''+m.n+'\',\'buy\')" class="sb"><small style="font-size:10px;opacity:.6">Buy</small><b style="color:'+col+';font-size:11px" id="b-'+i+'">'+buy+'</b></div><span onclick="openT(\''+m.n+'\')" style="opacity:.3">›</span></div></div>';}mList.innerHTML=h;}
function openT(s,d){cS=s;var m=mk.find(x=>x.n===s);cP=m.p;tSym.innerText=s;tPrice.innerText=cP.toFixed(2);showP('trade');if(d)setTimeout(()=>doT(d),150);initC();}
function run(){setInterval(function(){for(var i=0;i<mk.length;i++){mk[i].p+=(Math.random()-0.5)*(mk[i].p>1000?2.5:0.0005);if(Math.random()>0.8)mk[i].up=mk[i].up?0:1;var sp=mk[i].n.includes('JPY')?0.032:mk[i].n.includes('XAU')?0.45:mk[i].p>1000?4.3:0.00021;var sell=(mk[i].p - sp/2).toFixed(mk[i].n.includes('JPY')?3:mk[i].p>100?2:5);var buy=(mk[i].p + sp/2).toFixed(mk[i].n.includes('JPY')?3:mk[i].p>100?2:5);var es=document.getElementById('s-'+i),eb=document.getElementById('b-'+i);if(es)es.innerText=sell;if(eb)eb.innerText=buy;if(mk[i].n===cS){cP=mk[i].p;if(tPrice)tPrice.innerText=cP.toFixed(2);}}},700);}
function doT(dir){var amt=parseFloat(tAmt.value);if(amt<50||amt>bal[cA]){alert('Min 50 or Low');return;}bal[cA]-=amt;upd();var e=cP,id=Date.now();var div=document.createElement('div');div.id='pos-'+id;div.style.cssText='background:#111;border:1px solid #222;border-radius:12px;padding:10px;margin-top:8px;font-size:12px';div.innerText='⏳ '+dir.toUpperCase()+' '+cS+' '+amt+' @ '+e.toFixed(2);pos.appendChild(div);setTimeout(function(){var w=Math.random()>0.45;var el=document.getElementById('pos-'+id);if(w){bal[cA]+=amt*1.95;if(el){el.innerText='✅ WIN +'+(amt*0.95).toFixed(0);el.style.border='1px solid #22c55e';}}else{if(el){el.innerText='❌ LOSS -'+amt;el.style.border='1px solid #ef4444';}}upd();},700);}
function upd(){bDemo.innerText='KSh '+bal.demo.toFixed(2);bReal.innerText='KSh '+bal.real.toFixed(2);balT.innerText='KSh '+(cA==='demo'?bal.demo:bal.real).toFixed(2);accL.innerText=cA.toUpperCase();rAct.className=cA==='real'?'':'hidden';}
function swA(t){cA=t;bD.className=t==='demo'?'btn btn-w':'btn btn-d';bR.className=t==='real'?'btn btn-w':'btn btn-d';upd();}
function openM(t){modal.classList.remove('hidden');var ph=localStorage.getItem('apex_phone')||'07';if(t==='dep'){mBox.innerHTML='<h3>Deposit M-Pesa</h3><input id="dPh" value="'+ph+'" class="inp" style="text-align:center;border:2px solid #22c55e66"><input id="mAmt" type="number" value="500" class="inp" style="text-align:center"><div id="eM" class="hidden" style="color:#f44"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button onclick="closeM()" class="btn btn-d">Cancel</button><button onclick="doDep()" class="btn btn-g">DEPOSIT</button></div>';}else{mBox.innerHTML='<h3>Withdraw</h3><input id="wPh" value="'+ph+'" class="inp"><input id="mAmt" type="number" value="500" class="inp"><div id="eM" class="hidden" style="color:#f44"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px"><button onclick="closeM()" class="btn btn-d">Cancel</button><button onclick="doWith()" class="btn btn-w">WITHDRAW</button></div>';}}
function closeM(){modal.classList.add('hidden');}
function doDep(){var a=parseFloat(mAmt.value),ph=dPh.value.trim();if(a<500||ph.length<10){eM.innerText='Min 500';eM.classList.remove('hidden');return;}bal[cA]+=a;upd();closeM();alert('✅ '+a+' from '+ph);}
function doWith(){var a=parseFloat(mAmt.value);if(a<500||a>bal[cA]){eM.innerText='Check';eM.classList.remove('hidden');return;}bal[cA]-=a;upd();closeM();alert('Withdraw '+a);}
function openMore(t){modal.classList.remove('hidden');var n=localStorage.getItem('apex_name')||'amos',e=localStorage.getItem('apex_current')||'toxcykim@gmail.com',ph=localStorage.getItem('apex_phone')||'0713667827';if(t==='cal'){mBox.innerHTML='<h3>📅 Economic Calendar</h3><div style="margin-top:10px"><div style="background:#111;padding:12px;border-radius:10px;margin-top:8px"><b>09:30 USD - NFP Report</b><br><small style="opacity:.6">High impact</small><br><span style="color:#22c55e">Expected 200K</span></div><div style="background:#111;padding:12px;border-radius:10px;margin-top:8px"><b>12:00 EUR - CPI Data</b><br><small style="opacity:.6">Medium impact</small><br><span style="color:#ef4444">Expected 2.1%</span></div><div style="background:#111;padding:12px;border-radius:10px;margin-top:8px"><b>15:00 GBP - Interest Rate</b><br><small style="opacity:.6">High impact</small></div></div><button onclick="closeM()" class="btn btn-d" style="margin-top:10px">Close</button>';}else if(t==='acc'){mBox.innerHTML='<h3>👥 Trading account</h3><div style="background:#111;padding:12px;border-radius:12px;margin-top:10px"><div style="display:flex;justify-content:space-between"><span>Type</span><b>'+cA.toUpperCase()+'</b></div><div style="display:flex;justify-content:space-between;margin-top:8px"><span>Balance</span><b>KSh '+(cA==='demo'?bal.demo:bal.real).toFixed(2)+'</b></div><div style="display:flex;justify-content:space-between;margin-top:8px"><span>Leverage</span><b>1:500</b></div><div style="display:flex;justify-content:space-between;margin-top:8px"><span>Payout</span><b style="color:#22c55e">95%</b></div></div><button onclick="closeM()" class="btn btn-w" style="margin-top:10px">Close</button>';}else if(t==='pro'){mBox.innerHTML='<h3>👤 Profile & Security</h3><div style="background:#111;padding:12px;border-radius:12px;margin-top:10px"><label style="font-size:10px;opacity:.6">Full Name</label><input value="'+n+'" class="inp"><label style="font-size:10px;opacity:.6;margin-top:8px;display:block">Email</label><input value="'+e+'" class="inp"><label style="font-size:10px;opacity:.6;margin-top:8px;display:block">Phone</label><input value="'+ph+'" class="inp" style="border:1px solid #22c55e66"><div style="margin-top:12px"><div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #222"><span>🔒 Password</span><b style="color:#3b82f6">Change ›</b></div><div style="display:flex;justify-content:space-between;padding:8px 0"><span>✅ KYC</span><b style="color:#22c55e">Verified</b></div></div></div><button onclick="closeM()" class="btn btn-w" style="margin-top:10px">Save</button>';}else if(t==='set'){mBox.innerHTML='<h3>⚙️ App settings</h3><div style="margin-top:10px"><div class="more" style="margin:8px 0"><span>🔔 Notifications</span><span style="color:#22c55e">ON</span></div><div class="more" style="margin:8px 0"><span>🌙 Dark Mode</span><span style="color:#22c55e">ON</span></div><div class="more" style="margin:8px 0"><span>🌍 Language</span><span>English</span></div><div class="more" style="margin:8px 0"><span>💱 Currency</span><span>KSh</span></div></div><button onclick="closeM()" class="btn btn-d" style="margin-top:10px">Close</button>';}else if(t==='chat'){mBox.innerHTML='<h3>🎧 Live Chat</h3><div style="background:#111;padding:12px;border-radius:12px;height:180px;margin-top:10px"><div style="background:#0095ff;color:#fff;padding:8px 12px;border-radius:12px;max-width:80%;font-size:12px">Hi '+n+'! How can we help? 💬</div><div style="background:#222;padding:8px 12px;border-radius:12px;max-width:80%;margin-left:auto;margin-top:8px;font-size:12px">My deposit?</div><div style="background:#0095ff;color:#fff;padding:8px 12px;border-radius:12px;max-width:80%;margin-top:8px;font-size:12px">Send M-Pesa code, we verify in 2 mins.</div></div><div style="display:flex;gap:6px;margin-top:8px"><input placeholder="Type..." class="inp" style="margin:0"><button class="btn btn-w" style="width:60px">Send</button></div><button onclick="closeM()" class="btn btn-d" style="margin-top:8px">Close</button>';}else if(t==='leg'){mBox.innerHTML='<h3>📄 Legal documents</h3><div style="margin-top:10px"><div style="background:#111;padding:12px;border-radius:10px;margin-top:8px"><b>Terms & Conditions ›</b><br><small style="opacity:.6">Trading rules & risk</small></div><div style="background:#111;padding:12px;border-radius:10px;margin-top:8px"><b>Privacy Policy ›</b><br><small style="opacity:.6">M-Pesa data handling</small></div><div style="background:#111;padding:12px;border-radius:10px;margin-top:8px"><b>Risk Warning ›</b></div></div><button onclick="closeM()" class="btn btn-d" style="margin-top:10px">Close</button>';}}
var ctx,can;function initC(){can=document.getElementById('pc');if(!can)return;ctx=can.getContext('2d');cand=[];setInterval(function(){let last=cand.length?cand[cand.length-1].c:cP;let o=last,c=cP+(Math.random()-0.5)*1.2,h=Math.max(o,c)+Math.random()*0.6,l=Math.min(o,c)-Math.random()*0.6;cand.push({o:o,h:h,l:l,c:c});if(cand.length>35)cand.shift();drawC();},700);}
function drawC(){if(!ctx||!cand.length)return;ctx.clearRect(0,0,340,160);let min=Math.min(...cand.map(c=>c.l)),max=Math.max(...cand.map(c=>c.h)),rg=max-min||1,w=340/cand.length;cand.forEach((c,i)=>{let x=i*w+w/2,up=c.c>=c.o,yH=160-((c.h-min)/rg*120)-10,yL=160-((c.l-min)/rg*120)-10,yO=160-((c.o-min)/rg*120)-10,yC=160-((c.c-min)/rg*120)-10;ctx.strokeStyle=up?'#22c55e':'#ef4444';ctx.fillStyle=up?'#22c55e':'#ef4444';ctx.beginPath();ctx.moveTo(x,yH);ctx.lineTo(x,yL);ctx.stroke();ctx.fillRect(x-w*0.25,Math.min(yO,yC),w*0.5,Math.abs(yO-yC)||2);});}
(function(){var cur=localStorage.getItem('apex_current');if(cur){var u=JSON.parse(localStorage.getItem('apex_users')||'[]');var f=u.find(x=>x.email===cur);if(f){auth.style.display='none';mName.innerText=f.name;mEmail.innerText=f.email;mPh.innerText=f.phone;}}render();upd();run();initC();})();
</script></body></html>

<!-- REPLACE your <div id="p-trade"> with this PRO version -->

<div id="p-trade" class="phase hidden">
<button onclick="showP('market')" style="background:0;border:0;color:#fff">← Markets</button>

<!-- GRAPH OPTIONS BAR -->
<div style="display:flex;gap:6px;margin:10px 0;overflow:auto">
<button onclick="setType('candle')" id="t-candle" class="btn btn-w" style="padding:6px 10px;font-size:10px;width:auto">🕯️ Candles</button>
<button onclick="setType('line')" id="t-line" class="btn btn-d" style="padding:6px 10px;font-size:10px;width:auto">Line</button>
<button onclick="setType('area')" id="t-area" class="btn btn-d" style="padding:6px 10px;font-size:10px;width:auto">Area</button>
<button onclick="toggleMA()" id="t-ma" class="btn btn-d" style="padding:6px 10px;font-size:10px;width:auto">MA: OFF</button>
</div>

<div style="display:flex;gap:6px;margin-bottom:8px;overflow:auto">
<button onclick="setTF(1)" id="tf-1" class="btn btn-w" style="padding:6px 10px;font-size:10px;width:auto">1s</button>
<button onclick="setTF(5)" id="tf-5" class="btn btn-d" style="padding:6px 10px;font-size:10px;width:auto">5s</button>
<button onclick="setTF(30)" id="tf-30" class="btn btn-d" style="padding:6px 10px;font-size:10px;width:auto">30s</button>
<button onclick="setTF(60)" id="tf-60" class="btn btn-d" style="padding:6px 10px;font-size:10px;width:auto">1m</button>
<button onclick="fullChart()" class="btn btn-d" style="padding:6px 10px;font-size:10px;width:auto;margin-left:auto">⛶ Full</button>
</div>

<div class="card" style="text-align:center;padding:8px">
<div style="display:flex;justify-content:space-between;align-items:center">
<span id="tSym" style="font-size:11px;opacity:.6">XAUUSD</span>
<span id="tChange" style="font-size:11px;color:#22c55e">+0.32%</span>
<span id="tPrice" style="font-size:20px;font-weight:900">4424.60</span>
</div>

<!-- CANVAS PRO CHART -->
<canvas id="proChart" width="340" height="220" style="width:100%;height:220px;background:#000;border-radius:12px;margin-top:8px"></canvas>

<div style="display:flex;justify-content:space-between;font-size:10px;opacity:.5;margin-top:6px">
<span>O: <b id="oVal">4424.1</b></span>
<span>H: <b id="hVal">4425.8</b></span>
<span>L: <b id="lVal">4423.2</b></span>
<span>C: <b id="cVal">4424.6</b></span>
</div>
</div>

<div class="card">
<label style="font-size:11px;opacity:.6">Stake KSh (Min 50)</label>
<input id="tAmt" type="number" value="100" class="inp" style="text-align:center;font-weight:900;font-size:18px">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px">
<button onclick="doT('buy')" class="btn btn-g" style="padding:18px">▲ BUY • 95%</button>
<button onclick="doT('sell')" class="btn" style="padding:18px;background:#ef4444;color:#fff">▼ SELL • 95%</button>
</div>
</div>
<div id="pos"></div>
</div>

<script>
// ADD THIS PRO CHART ENGINE after your run() function
let chartType='candle', tf=1, showMA=false, candles=[];
let canvas, ctx;
function initPro(){
 canvas=document.getElementById('proChart'); ctx=canvas.getContext('2d');
 setInterval(proTick, tf*1000);
}
function proTick(){
 let last=candles.length?candles[candles.length-1].c:cP;
 let open=last, close=cP+(Math.random()-0.5)*1.5;
 let high=Math.max(open,close)+Math.random()*0.8;
 let low=Math.min(open,close)-Math.random()*0.8;
 candles.push({o:open,h:high,l:low,c:close,vol:20+Math.random()*80});
 if(candles.length>60) candles.shift();
 drawPro();
 document.getElementById('oVal').innerText=open.toFixed(2);
 document.getElementById('hVal').innerText=high.toFixed(2);
 document.getElementById('lVal').innerText=low.toFixed(2);
 document.getElementById('cVal').innerText=close.toFixed(2);
 document.getElementById('tChange').innerText=((close-open)/open*100).toFixed(2)+'%';
 document.getElementById('tChange').style.color=close>=open?'#22c55e':'#ef4444';
}
function drawPro(){
 if(!ctx) return;
 ctx.clearRect(0,0,340,220);
 let min=Math.min(...candles.map(c=>c.l)), max=Math.max(...candles.map(c=>c.h));
 let range=max-min||1;
 let w=340/candles.length;
 // grid
 ctx.strokeStyle='#111'; ctx.lineWidth=1;
 for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(0,i*55);ctx.lineTo(340,i*55);ctx.stroke();}
 
 if(chartType==='line'){
  ctx.strokeStyle='#22c55e'; ctx.lineWidth=2; ctx.beginPath();
  candles.forEach((c,i)=>{let x=i*w+w/2, y=220-((c.c-min)/range*180)-20; if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);}); ctx.stroke();
 } else if(chartType==='area'){
  ctx.fillStyle='rgba(34,197,94,0.2)'; ctx.strokeStyle='#22c55e'; ctx.lineWidth=2; ctx.beginPath();
  candles.forEach((c,i)=>{let x=i*w+w/2, y=220-((c.c-min)/range*180)-20; if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y);}); ctx.lineTo(340,220); ctx.lineTo(0,220); ctx.closePath(); ctx.fill(); ctx.stroke();
 } else {
  candles.forEach((c,i)=>{
   let x=i*w+w/2, isUp=c.c>=c.o;
   let yH=220-((c.h-min)/range*180)-20, yL=220-((c.l-min)/range*180)-20;
   let yO=220-((c.o-min)/range*180)-20, yC=220-((c.c-min)/range*180)-20;
   ctx.strokeStyle=isUp?'#22c55e':'#ef4444'; ctx.fillStyle=isUp?'#22c55e':'#ef4444';
   ctx.beginPath(); ctx.moveTo(x,yH); ctx.lineTo(x,yL); ctx.stroke();
   ctx.fillRect(x-w*0.3, Math.min(yO,yC), w*0.6, Math.abs(yO-yC)||2);
  });
 }
 if(showMA && candles.length>5){
  ctx.strokeStyle='#facc15'; ctx.lineWidth=1.5; ctx.beginPath();
  for(let i=0;i<candles.length;i++){
   if(i<4) continue; let sum=0; for(let j=0;j<5;j++) sum+=candles[i-j].c; let ma=sum/5;
   let x=i*w+w/2, y=220-((ma-min)/range*180)-20; if(i===4)ctx.moveTo(x,y); else ctx.lineTo(x,y);
  } ctx.stroke();
 }
}
function setType(t){chartType=t; document.getElementById('t-candle').className=t==='candle'?'btn btn-w':'btn btn-d'; document.getElementById('t-line').className=t==='line'?'btn btn-w':'btn btn-d'; document.getElementById('t-area').className=t==='area'?'btn btn-w':'btn btn-d'; drawPro();}
function setTF(v){tf=v; ['1','5','30','60'].forEach(x=>document.getElementById('tf-'+x).className='btn btn-d'); document.getElementById('tf-'+v).className='btn btn-w';}
function toggleMA(){showMA=!showMA; document.getElementById('t-ma').innerText='MA: '+(showMA?'ON':'OFF'); document.getElementById('t-ma').className=showMA?'btn btn-w':'btn btn-d';}
function fullChart(){let c=document.getElementById('proChart'); if(c.requestFullscreen) c.requestFullscreen();}

// call this in your ok() and after render
setTimeout(initPro,500);
</script>

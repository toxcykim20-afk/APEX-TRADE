<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APEX TRADE</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#000;color:#fff}.wrap{max-width:430px;margin:0 auto;min-height:100vh;background:#000;display:flex;flex-direction:column}.inp{width:100%;background:#191919;border:1px solid #2a2a2a;padding:14px;border-radius:12px;color:#fff;margin-top:10px}.btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:900}.btn-w{background:#fff;color:#000}.btn-g{background:#22c55e;color:#000}.btn-d{background:#222;color:#fff}.phase{flex:1;overflow:auto}.hidden{display:none!important}.nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid #1a1a1a;background:#000;padding:8px 0;position:sticky;bottom:0}.nav button{background:0;border:0;color:#fff;opacity:.5;font-size:11px}.nav button.on{opacity:1;color:#22c55e}

</style></head><body><div class="wrap">
<div id="auth" style="position:fixed;inset:0;background:#000;z-index:100;padding:20px;overflow:auto"><div style="text-align:center;margin:24px 0"><div style="width:70px;height:70px;background:#111;border-radius:20px;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:30px">A↗</div><b style="letter-spacing:3px;display:block;margin-top:8px">APEX TRADE</b><span style="font-size:10px;opacity:.5">95% • 0.7s • Min 500</span></div><div id="siBox"><h3>Sign In</h3><input id="siE" class="inp" placeholder="Email"><input id="siP" class="inp" type="password" placeholder="Password"><div id="siErr" class="hidden" style="color:#f44;font-size:11px;text-align:center;margin-top:8px"></div><button onclick="doSI()" class="btn btn-w" style="margin-top:12px">SIGN IN →</button><p style="text-align:center;font-size:12px;margin-top:10px;opacity:.6">No account? <button onclick="showA('su')" style="background:0;border:0;color:#3b82f6;font-weight:900">Sign Up</button></p></div><div id="suBox" class="hidden"><h3>Create Account</h3><input id="suN" class="inp" placeholder="Full Name"><input id="suE" class="inp" placeholder="Email"><input id="suPh" class="inp" placeholder="M-Pesa 07..." style="border:1px solid #22c55e44"><input id="suP" class="inp" type="password" placeholder="Password"><input id="suCP" class="inp" type="password" placeholder="Confirm"><div id="suErr" class="hidden" style="color:#f44;font-size:11px;text-align:center;margin-top:8px"></div><button onclick="doSU()" class="btn btn-g" style="margin-top:12px">SIGN UP →</button><p style="text-align:center;font-size:12px;margin-top:10px;opacity:.6">Have account? <button onclick="showA('si')" style="background:0;border:0;color:#3b82f6;font-weight:900">Sign In</button></p></div></div>
<div style="padding:10px 12px;display:flex;justify-content:space-between;border-bottom:1px solid #111"><div><span id="accL" style="font-size:10px;background:#111;padding:4px 8px;border-radius:6px">DEMO</span><br><b id="balT">KSh 1,000.00</b></div><button onclick="showP('funds')" class="btn btn-w" style="width:auto;padding:8px 14px;font-size:11px">Deposit</button></div>

<div id="modal" class="hidden modal"><div id="mBox" class="box"></div></div>
<script>
var mk=[{n:'XAUUSD',p:4424.62,up:false},{n:'BTCUSD',p:79842.6,up:false},{n:'EURUSD',p:1.16120,up:true},{n:'USDJPY',p:156.245,up:false},{n:'GBPUSD',p:1.35161,up:false},{n:'US100',p:29565.1,up:true},{n:'AUDUSD',p:0.72055,up:true},{n:'GBPJPY',p:211.178,up:false},{n:'AUDJPY',p:112.578,up:false},{n:'AUDCAD',p:0.99720,up:true}];
var bal={demo:1000,real:0},cA='demo',cP=4424.6,cS='XAUUSD',candles=[];
function showA(t){siBox.classList.toggle('hidden',t!='si');suBox.classList.toggle('hidden',t!='su');}
function doSU(){var n=suN.value.trim(),e=suE.value.trim().toLowerCase(),ph=suPh.value.trim(),pw=suP.value,cp=suCP.value,er=suErr;if(n.length<3||e.indexOf('@')<0||ph.length<10||pw.length<6||pw!==cp){er.innerText='Check fields';er.classList.remove('hidden');return;}var u=JSON.parse(localStorage.getItem('apex_users')||'[]');if(u.find(x=>x.email===e)){er.innerText='Exists';er.classList.remove('hidden');return;}u.push({name:n,email:e,phone:ph,pass:pw});localStorage.setItem('apex_users',JSON.stringify(u));localStorage.setItem('apex_current',e);localStorage.setItem('apex_name',n);localStorage.setItem('apex_phone',ph);ok(n,e,ph);}
function doSI(){var e=siE.value.trim().toLowerCase(),pw=siP.value,er=siErr;var u=JSON.parse(localStorage.getItem('apex_users')||'[]');var f=u.find(x=>x.email===e&&x.pass===pw);if(!f){er.innerText='Wrong';er.classList.remove('hidden');return;}localStorage.setItem('apex_current',f.email);localStorage.setItem('apex_name',f.name);localStorage.setItem('apex_phone',f.phone);ok(f.name,f.email,f.phone);}
function ok(n,e,p){auth.style.display='none';mName.innerText=n;mEmail.innerText=e;mPh.innerText=p;render();run();upd();initPro();}
function logout(){localStorage.removeItem('apex_current');location.reload();}
function showP(p){document.querySelectorAll('.phase').forEach(x=>x.classList.add('hidden'));document.getElementById('p-'+p).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('on'));document.getElementById('n-'+p).classList.add('on');}
function render(){var h='';for(var i=0;i<mk.length;i++){var m=mk[i];var spread=m.n.includes('JPY')?0.032:m.n.includes('XAU')?0.45:m.p>1000?4.3:0.00021;var sell=(m.p - spread/2).toFixed(m.n.includes('JPY')?3:m.p>100?2:5);var buy=(m.p + spread/2).toFixed(m.n.includes('JPY')?3:m.p>100?2:5);var pct=(Math.random()*2.5+0.04).toFixed(2);var col=m.up?'green':'red',arr=m.up?'▲':'▼';h+='<div class="row"><div><div class="sym">'+m.n+' <span style="opacity:.3">★</span></div><div class="pct '+col+'">'+arr+' '+pct+'%</div></div><div class="sellbuy"><div onclick="openT(\''+m.n+'\',\'sell\')" class="sb"><small>Sell</small><b class="'+col+'" id="sell-'+i+'">'+sell+'</b></div><div onclick="openT(\''+m.n+'\',\'buy\')" class="sb"><small>Buy</small><b class="'+col+'" id="buy-'+i+'">'+buy+'</b></div><span style="opacity:.3;margin-left:4px" onclick="openT(\''+m.n+'\')">›</span></div></div>';}mList.innerHTML=h;}
function openT(s,dir){cS=s;var m=mk.find(x=>x.n===s);cP=m.p;tSym.innerText=s;tPrice.innerText=cP.toFixed(2);showP('trade');if(dir)setTimeout(()=>doT(dir),200);initPro();}
function run(){setInterval(function(){for(var i=0;i<mk.length;i++){var ch=(Math.random()-0.5)*(mk[i].p>1000?2.5:0.0005);mk[i].p+=ch;if(Math.random()>0.85)mk[i].up=!mk[i].up;var spread=mk[i].n.includes('JPY')?0.032:mk[i].n.includes('XAU')?0.45:mk[i].p>1000?4.3:0.00021;var sell=(mk[i].p - spread/2).toFixed(mk[i].n.includes('JPY')?3:mk[i].p>100?2:5);var buy=(mk[i].p + spread/2).toFixed(mk[i].n.includes('JPY')?3:mk[i].p>100?2:5);var es=document.getElementById('sell-'+i);var eb=document.getElementById('buy-'+i);if(es){es.innerText=sell;es.className=mk[i].up?'green':'red';}if(eb){eb.innerText=buy;eb.className=mk[i].up?'green':'red';}if(mk[i].n===cS){cP=mk[i].p;var tp=document.getElementById('tPrice');if(tp)tp.innerText=cP.toFixed(2);}}},700);}
function doT(dir){var amt=parseFloat(tAmt.value);if(amt<50||amt>bal[cA]){alert('Min 50 or Low');return;}bal[cA]-=amt;upd();var e=cP,id=Date.now();var div=document.createElement('div');div.id='pos-'+id;div.style.cssText='background:#111;border:1px solid #222;border-radius:12px;padding:10px;margin-top:8px;font-size:12px';div.innerText='⏳ '+dir.toUpperCase()+' '+cS+' KSh '+amt+' @ '+e.toFixed(2);pos.appendChild(div);setTimeout(function(){var w=Math.random()>0.45;var el=document.getElementById('pos-'+id);if(w){bal[cA]+=amt*1.95;if(el){el.innerText='✅ WIN +'+(amt*0.95).toFixed(0)+' | '+cP.toFixed(2);el.style.border='1px solid #22c55e';}}else{if(el){el.innerText='❌ LOSS -'+amt+' | '+cP.toFixed(2);el.style.border='1px solid #ef4444';}}upd();},700);}
function upd(){bDemo.innerText='KSh '+bal.demo.toFixed(2);bReal.innerText='KSh '+bal.real.toFixed(2);balT.innerText='KSh '+(cA==='demo'?bal.demo:bal.real).toFixed(2);accL.innerText=cA.toUpperCase();rAct.className=cA==='real'?'':'hidden';}
function swA(t){cA=t;bD.className=t==='demo'?'btn btn-w':'btn btn-d';bR.className=t==='real'?'btn btn-w':'btn btn-d';upd();}
function openM(t){modal.classList.remove('hidden');var ph=localStorage.getItem('apex_phone')||'07';if(t==='dep'){mBox.innerHTML='<h3>Deposit M-Pesa</h3><input id="dPh" value="'+ph+'" class="inp" style="text-align:center;font-weight:bold;border:2px solid #22c55e66"><input id="mAmt" type="number" value="500" class="inp" style="text-align:center;font-weight:900"><div id="eM" class="hidden" style="color:#f44;font-size:11px;text-align:center"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button onclick="closeM()" class="btn btn-d">Cancel</button><button onclick="doDep()" class="btn btn-g">DEPOSIT</button></div>';}else{mBox.innerHTML='<h3>Withdraw</h3><input id="wPh" value="'+ph+'" class="inp" style="text-align:center"><input id="mAmt" type="number" value="500" class="inp" style="text-align:center"><div id="eM" class="hidden" style="color:#f44"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px"><button onclick="closeM()" class="btn btn-d">Cancel</button><button onclick="doWith()" class="btn btn-w">WITHDRAW</button></div>';}}
function closeM(){modal.classList.add('hidden');}
function doDep(){var a=parseFloat(mAmt.value),ph=dPh.value.trim(),er=eM;if(a<500||ph.length<10){er.innerText='Min 500 & 07...';er.classList.remove('hidden');return;}mBox.innerHTML='<div style="text-align:center"><div style="width:60px;height:60px;background:#22c55e;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;color:#000;font-size:28px">📱</div><h3 style="margin-top:10px">STK to '+ph+'</h3><p>KSh '+a+'</p><input id="mpCode" placeholder="M-Pesa Code" class="inp" style="text-align:center"><button onclick="confDep('+a+',\''+ph+'\')" class="btn btn-w" style="margin-top:10px">VERIFY</button></div>';}
function confDep(a,ph){var c=mpCode.value.trim();if(c.length<5){alert('Code');return;}bal[cA]+=a;upd();closeM();alert('✅ '+a+' from '+ph);}
function doWith(){var a=parseFloat(mAmt.value),ph=wPh.value;if(a<500||a>bal[cA]){eM.innerText='Check';eM.classList.remove('hidden');return;}bal[cA]-=a;upd();closeM();alert('Withdraw '+a+' to '+ph);}
// MORE INNER PAGES - FILLED INSIDE WHEN CLICK
function openMore(type){
 modal.classList.remove('hidden');
 var name=localStorage.getItem('apex_name')||'Amos', email=localStorage.getItem('apex_current')||'', phone=localStorage.getItem('apex_phone')||'';
 if(type==='calendar'){
  mBox.innerHTML='<h3>📅 Economic Calendar</h3><div style="margin-top:12px"><div style="background:#111;padding:10px;border-radius:10px;margin-top:8px"><b>09:30 USD - NFP</b><br><small style="opacity:.6">High impact - USD pairs volatile</small><br><span style="color:#22c55e;font-size:12px">▲ Expected 200K</span></div><div style="background:#111;padding:10px;border-radius:10px;margin-top:8px"><b>12:00 EUR - CPI</b><br><small style="opacity:.6">Medium impact</small><br><span style="color:#ef4444;font-size:12px">▼ Expected 2.1%</span></div><div style="background:#111;padding:10px;border-radius:10px;margin-top:8px"><b>15:00 GBP - Interest Rate</b><br><small style="opacity:.6">High impact - GBPUSD spike</small></div></div><button onclick="closeM()" class="btn btn-d" style="margin-top:12px">Close</button>';
 }else if(type==='account'){
  mBox.innerHTML='<h3>👥 Trading account</h3><div style="margin-top:12px;background:#111;padding:12px;border-radius:12px"><div style="display:flex;justify-content:space-between"><span>Account Type</span><b>'+cA.toUpperCase()+'</b></div><div style="display:flex;justify-content:space-between;margin-top:8px"><span>Balance</span><b>KSh '+(cA==='demo'?bal.demo:bal.real).toFixed(2)+'</b></div><div style="display:flex;justify-content:space-between;margin-top:8px"><span>Leverage</span><b>1:500</b></div><div style="display:flex;justify-content:space-between;margin-top:8px"><span>Currency</span><b>KSh</b></div><div style="display:flex;justify-content:space-between;margin-top:8px"><span>Payout</span><b style="color:#22c55e">95%</b></div></div><button onclick="closeM()" class="btn btn-w" style="margin-top:12px">Close</button>';
 }else if(type==='profile'){
  mBox.innerHTML='<h3>👤 Profile & Security</h3><div style="margin-top:12px"><div style="background:#111;padding:12px;border-radius:12px"><label style="font-size:10px;opacity:.6">Full Name</label><input value="'+name+'" class="inp" style="margin-top:4px"><label style="font-size:10px;opacity:.6;margin-top:8px;display:block">Email</label><input value="'+email+'" class="inp" style="margin-top:4px"><label style="font-size:10px;opacity:.6;margin-top:8px;display:block">M-Pesa Phone</label><input value="'+phone+'" class="inp" style="margin-top:4px;border:1px solid #22c55e66"></div><div style="background:#111;padding:12px;border-radius:12px;margin-top:8px"><div style="display:flex;justify-content:space-between"><span>🔒 Password</span><b style="color:#3b82f6">Change ›</b></div><div style="display:flex;justify-content:space-between;margin-top:10px"><span>🛡️ 2FA</span><b style="color:#ef4444">OFF ›</b></div><div style="display:flex;justify-content:space-between;margin-top:10px"><span>✅ KYC Verified</span><b style="color:#22c55e">Verified</b></div></div></div><button onclick="closeM()" class="btn btn-w" style="margin-top:12px">Save</button>';
 }else if(type==='settings'){
  mBox.innerHTML='<h3>⚙️ App settings</h3><div style="margin-top:12px"><div class="more-item" style="margin:8px 0"><span>🔔 Notifications</span><span style="color:#22c55e">ON</span></div><div class="more-item" style="margin:8px 0"><span>🌙 Dark Mode</span><span style="color:#22c55e">ON</span></div><div class="more-item" style="margin:8px 0"><span>🌍 Language</span><span>English</span></div><div class="more-item" style="margin:8px 0"><span>💱 Currency Display</span><span>KSh</span></div><div class="more-item" style="margin:8px 0"><span>🔊 Sound</span><span>ON</span></div></div><button onclick="closeM()" class="btn btn-d" style="margin-top:12px">Close</button>';
 }else if(type==='chat'){
  mBox.innerHTML='<h3>🎧 Live Chat</h3><div style="margin-top:12px;background:#111;padding:12px;border-radius:12px;height:200px;overflow:auto"><div style="background:#0095ff;color:#fff;padding:8px 12px;border-radius:12px;border-bottom-left-radius:2px;max-width:80%;margin-top:8px;font-size:12px">Hi '+name+'! How can we help you with APEX TRADE? 💬</div><div style="background:#222;padding:8px 12px;border-radius:12px;border-bottom-right-radius:2px;max-width:80%;margin-left:auto;margin-top:8px;font-size:12px">My deposit not showing</div><div style="background:#0095ff;color:#fff;padding:8px 12px;border-radius:12px;border-bottom-left-radius:2px;max-width:80%;margin-top:8px;font-size:12px">Please provide M-Pesa code and phone, we will verify in 2 mins.</div></div><div style="display:flex;gap:6px;margin-top:10px"><input placeholder="Type message..." class="inp" style="margin:0"><button class="btn btn-w" style="width:60px">Send</button></div><button onclick="closeM()" class="btn btn-d" style="margin-top:8px">Close</button>';
 }else if(type==='legal'){
  mBox.innerHTML='<h3>📄 Legal documents</h3><div style="margin-top:12px"><div style="background:#111;padding:12px;border-radius:12px;margin-top:8px" onclick="alert(\'Terms: Trading involves risk...\')"><b>Terms & Conditions ›</b><br><small style="opacity:.6">Risk disclosure, trading rules</small></div><div style="background:#111;padding:12px;border-radius:12px;margin-top:8px"><b>Privacy Policy ›</b><br><small style="opacity:.6">How we handle your M-Pesa data</small></div><div style="background:#111;padding:12px;border-radius:12px;margin-top:8px"><b>AML Policy ›</b></div><div style="background:#111;padding:12px;border-radius:12px;margin-top:8px"><b>Risk Warning ›</b></div></div><button onclick="closeM()" class="btn btn-d" style="margin-top:12px">Close</button>';
 }
}
var ctx,can;function initPro(){can=document.getElementById('proChart');if(!can)return;ctx=can.getContext('2d');candles=[];setInterval(function(){let last=candles.length?candles[candles.length-1].c:cP;let o=last,cc=cP+(Math.random()-0.5)*1.2;let h=Math.max(o,cc)+Math.random()*0.6,l=Math.min(o,cc)-Math.random()*0.6;candles.push({o:o,h:h,l:l,c:cc});if(candles.length>40)candles.shift();draw();},800);}
function draw(){if(!ctx||!candles.length)return;ctx.clearRect(0,0,340,180);let min=Math.min(...candles.map(c=>c.l)),max=Math.max(...candles.map(c=>c.h)),rg=max-min||1,w=340/candles.length;ctx.strokeStyle='#111';for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(0,i*45);ctx.lineTo(340,i*45);ctx.stroke();}candles.forEach((c,i)=>{let x=i*w+w/2,up=c.c>=c.o,yH=180-((c.h-min)/rg*140)-10,yL=180-((c.l-min)/rg*140)-10,yO=180-((c.o-min)/rg*140)-10,yC=180-((c.c-min)/rg*140)-10;ctx.strokeStyle=up?'#22c55e':'#ef4444';ctx.fillStyle=up?'#22c55e':'#ef4444';ctx.beginPath();ctx.moveTo(x,yH);ctx.lineTo(x,yL);ctx.stroke();ctx.fillRect(x-w*0.25,Math.min(yO,yC),w*0.5,Math.abs(yO-yC)||2);});}
(function(){var cur=localStorage.getItem('apex_current');if(cur){var u=JSON.parse(localStorage.getItem('apex_users')||'[]');var f=u.find(x=>x.email===cur);if(f){auth.style.display='none';mName.innerText=f.name;mEmail.innerText=f.email;mPh.innerText=f.phone;}}render();upd();run();initPro();})();

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APEX TRADE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#0f172a;color:#fff}
.header{background:#1e293b;padding:12px 16px;display:flex;justify-content:space-between}
.logo{font-weight:900;color:#22c55e;font-size:20px}
.balance{background:#22c55e;color:#000;padding:6px 12px;border-radius:20px;font-weight:700}
.install-banner{background:#22c55e;color:#000;text-align:center;padding:10px;font-weight:700;cursor:pointer}
.nav{display:flex;background:#1e293b;position:fixed;bottom:0;left:0;right:0}
.nav div{flex:1;text-align:center;padding:12px 0;cursor:pointer}
.nav div.active{color:#22c55e;border-top:2px solid #22c55e}
.page{padding:16px;padding-bottom:80px}
.card{background:#1e293b;border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid #334155}
.price{font-size:32px;font-weight:900}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:800;font-size:16px;margin-top:8px}
.btn-buy{background:#22c55e;color:#000}
.btn-sell{background:#ef4444;color:#fff}
</style>
</head>
<body>
<div class="install-banner" onclick="alert('Chrome 3 dots → Add to Home screen → Install')">📲 TAP HERE TO INSTALL TO YOUR SCREEN</div>
<div class="header"><div class="logo">APEX TRADE</div><div class="balance" id="bal">KSh 1,000.00</div></div>
<div class="page" id="tradePage">
<div class="card"><span>GOLD / USD</span><div class="price" id="price">$2,045.30</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn btn-buy" onclick="trade('buy')">BUY ▲</button><button class="btn btn-sell" onclick="trade('sell')">SELL ▼</button></div></div>
<div class="card"><b>Open Trades: <span id="tradesCount">0</span></b><div id="trades"></div></div>
</div>
<div class="page" id="fundsPage" style="display:none"><div class="card"><h3>Deposit MPESA</h3>Paybill 522533 Acc 7864202<br><input id="depAmt" type="number" placeholder="Amount KSh" style="width:100%;padding:12px;border-radius:8px;margin:8px 0"><button class="btn btn-buy" onclick="deposit()">Deposit</button></div></div>
<div class="page" id="morePage" style="display:none"><div class="card"><button class="btn btn-buy" onclick="alert('Chrome ⋮ → Add to Home screen')">📲 Install to Home Screen</button></div><div class="card"><button class="btn" style="background:#25D366;color:#fff" onclick="shareWA()">Share on WhatsApp</button><br><small>https://toxcykim20-afk.github.io/APEX-TRADE/</small></div></div>
<div class="nav"><div id="n1" class="active" onclick="showPage('trade')">📈<br>Trade</div><div id="n2" onclick="showPage('funds')">💰<br>Funds</div><div id="n3" onclick="showPage('more')">☰<br>More</div></div>
<script>
let bal=parseFloat(localStorage.getItem('apex_bal')||'1000'),price=2045.30,trades=JSON.parse(localStorage.getItem('apex_trades')||'[]');
function updateBal(){document.getElementById('bal').textContent='KSh '+bal.toFixed(2);localStorage.setItem('apex_bal',bal)}
function showPage(p){document.getElementById('tradePage').style.display=p=='trade'?'block':'none';document.getElementById('fundsPage').style.display=p=='funds'?'block':'none';document.getElementById('morePage').style.display=p=='more'?'block':'none';document.getElementById('n1').className=p=='trade'?'active':'';document.getElementById('n2').className=p=='funds'?'active':'';document.getElementById('n3').className=p=='more'?'active':''}
function trade(type){trades.push({type,entry:price,time:new Date().toLocaleTimeString()});localStorage.setItem('apex_trades',JSON.stringify(trades));renderTrades();alert(type.toUpperCase()+' placed!');setTimeout(()=>{bal+=(Math.random()*20-5);updateBal()},2000)}
function renderTrades(){document.getElementById('tradesCount').textContent=trades.length;document.getElementById('trades').innerHTML=trades.map(t=>`<div>${t.type.toUpperCase()} @ ${t.entry.toFixed(2)} - ${t.time}</div>`).join('')}
function deposit(){let a=parseFloat(document.getElementById('depAmt').value);if(!a)return;bal+=a;updateBal();alert('Added KSh '+a)}
function shareWA(){let t=encodeURIComponent('🔥 APEX TRADE 🔥\nTrade Gold KSh 1000 Demo\n👉 https://toxcykim20-afk.github.io/APEX-TRADE/');window.open('https://wa.me/?text='+t)}
setInterval(()=>{price+=(Math.random()-0.5)*2;document.getElementById('price').textContent='$'+price.toFixed(2)},1500);updateBal();renderTrades();
</script>
</body>
</html>
